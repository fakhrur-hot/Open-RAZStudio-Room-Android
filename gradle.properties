org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:HeapBaseMinAddress=0x800000000
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Large multi-module Android builds are faster with a single worker when the
# machine is memory-constrained or when incremental hot-fix rebuilds are common.
org.gradle.parallel=false
org.gradle.configuration-cache=false
# Reuse task outputs in ~/.gradle/caches/build-cache-1 (wrapper, modules, .cxx, and
# module build/ dirs already exist for this tree — do not wipe them).
org.gradle.caching=true

# SDK is under C:\Users\Public\Android\sdk. AGP's experimental
# android.overridePathCheck is not used; daemon user home stays in the profile.
# AGP 9 removed android.defaults.buildfeatures.buildconfig. Do not set it
# here or in ~/.gradle/gradle.properties. Enable BuildConfig per module with
# android { buildFeatures { buildConfig = true } }.

# -Xss16m: the JVM back-end's coroutine transformer recurses once per basic
# block (CoroutineTransformerMethodVisitor.addMonitorDepthToSuccs) and blew the
# default 1 MB thread stack on RawV3Coordinator.exportRawToGallery (~1000-line
# suspend fun) — the intermittent "Internal compiler error / Exception while
# generating code for" the CLAUDE.md build notes describe. A bigger stack makes
# that deterministic instead of luck-of-the-daemon.
kotlin.daemon.jvmargs=-Xmx4g -Xss16m -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:HeapBaseMinAddress=0x100000000
ksp.incremental=true
# Plain console: one line per task, no ANSI overwrites — lets IDEs (VS Code, IntelliJ)
# parse ">> Task :module:taskName" progress lines during any Gradle invocation.
org.gradle.console=plain
# Emit task lifecycle events (started / finished / skipped) so the IDE progress
# tracker can show per-module completion without needing --info or --debug.
org.gradle.logging.level=lifecycle